[project]
name = "evaluation-solution"
version = "1.0.0"
description = "InsightExtract AI: inventory conversational agent (Q2) and document classification/extraction pipeline (Q3)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B905"]
